apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-hdfs-namenode
spec:
  selector:
    app.kubernetes.io/name: hdfs-namenode
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - {name: rpc, port: 8020, targetPort: rpc}
    - {name: web, port: 9870, targetPort: web}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-hdfs-namenode
spec:
  serviceName: {{ .Release.Name }}-hdfs-namenode
  replicas: 1
  selector:
    matchLabels: &namenode
      app.kubernetes.io/name: hdfs-namenode
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels: *namenode
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/hdfs-config.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext: {fsGroup: 100}
      containers:
        - name: namenode
          image: {{ .Values.hdfs.image | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - bash
            - -ec
            - |
              if [ ! -f /data/name/current/VERSION ]; then
                if [ -d /data/name ] && [ -n "$(ls -A /data/name)" ]; then
                  echo "NameNode data directory is nonempty without VERSION" >&2
                  exit 1
                fi
                hdfs namenode -format -nonInteractive
              fi
              exec hdfs namenode
          envFrom:
            - configMapRef: {name: {{ .Release.Name }}-hdfs-config}
          ports:
            - {name: rpc, containerPort: 8020}
            - {name: web, containerPort: 9870}
          startupProbe:
            tcpSocket: {port: rpc}
            periodSeconds: 3
            failureThreshold: 50
          readinessProbe:
            httpGet: {path: "/webhdfs/v1/?op=GETFILESTATUS&user.name=hadoop", port: web}
          resources:
            {{- toYaml .Values.hdfs.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.hdfs.metadataSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-hdfs-datanode
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: hdfs-datanode
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - {name: transfer, port: 9866, targetPort: transfer}
    - {name: web, port: 9864, targetPort: web}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-hdfs-datanode
spec:
  serviceName: {{ .Release.Name }}-hdfs-datanode
  replicas: 1
  selector:
    matchLabels: &datanode
      app.kubernetes.io/name: hdfs-datanode
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels: *datanode
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/hdfs-config.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext: {fsGroup: 100}
      containers:
        - name: datanode
          image: {{ .Values.hdfs.image | quote }}
          imagePullPolicy: IfNotPresent
          args: [hdfs, datanode]
          envFrom:
            - configMapRef: {name: {{ .Release.Name }}-hdfs-config}
          env:
            - {name: WAITFOR, value: "{{ .Release.Name }}-hdfs-namenode:8020"}
            - {name: HDFS-SITE.XML_dfs.datanode.hostname, value: "{{ .Release.Name }}-hdfs-datanode-0.{{ .Release.Name }}-hdfs-datanode"}
          ports:
            - {name: transfer, containerPort: 9866}
            - {name: web, containerPort: 9864}
          startupProbe:
            tcpSocket: {port: transfer}
            periodSeconds: 3
            failureThreshold: 50
          readinessProbe:
            tcpSocket: {port: transfer}
          resources:
            {{- toYaml .Values.hdfs.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.hdfs.dataSize }}
