apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-graph-init
data:
  schema.json: {{ dict "gremlin" (.Files.Get "files/account_search_schema.groovy") | toJson | quote }}
  {{- if .Values.janusgraph.seedDemo }}
  seed.json: {{ dict "gremlin" (.Files.Get "files/seed_history.groovy") | toJson | quote }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-janusgraph
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: &selector
      app.kubernetes.io/name: janusgraph
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels: *selector
      annotations:
        checksum/init: {{ printf "%s%s" (.Files.Get "files/account_search_schema.groovy") (.Files.Get "files/seed_history.groovy") | sha256sum }}
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-cassandra
          image: {{ .Values.cassandra.image | quote }}
          imagePullPolicy: {{ .Values.cassandra.imagePullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              for attempt in $(seq 1 60); do
                if cqlsh "$CASSANDRA_HOST" 9042 --connect-timeout=3 --request-timeout=3 -e 'SELECT release_version FROM system.local'; then
                  exit 0
                fi
                sleep 2
              done
              exit 1
          env:
            - {name: CASSANDRA_HOST, value: "{{ .Release.Name }}-cql"}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {memory: 128Mi}
        - name: wait-for-elasticsearch
          image: {{ .Values.janusgraph.image | quote }}
          imagePullPolicy: {{ .Values.janusgraph.imagePullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              for attempt in $(seq 1 60); do
                if curl -fsS --max-time 4 "$ELASTICSEARCH_URL/_cluster/health?wait_for_status=yellow&timeout=2s"; then
                  exit 0
                fi
                sleep 2
              done
              exit 1
          env:
            - {name: ELASTICSEARCH_URL, value: "http://{{ .Release.Name }}-elasticsearch:9200"}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {memory: 128Mi}
      containers:
        - name: janusgraph
          image: {{ .Values.janusgraph.image | quote }}
          imagePullPolicy: {{ .Values.janusgraph.imagePullPolicy }}
          ports:
            - {name: gremlin, containerPort: 8182}
          env:
            - {name: JANUS_PROPS_TEMPLATE, value: cql}
            - {name: janusgraph.storage.hostname, value: "{{ .Release.Name }}-cql"}
            - {name: janusgraph.storage.cql.replication-factor, value: "1"}
            - {name: janusgraph.index.search.backend, value: elasticsearch}
            - {name: janusgraph.index.search.hostname, value: "{{ .Release.Name }}-elasticsearch"}
            - {name: JAVA_OPTIONS, value: "-Xms256m -Xmx512m"}
            - {name: gremlinserver.channelizer, value: org.apache.tinkerpop.gremlin.server.channel.WsAndHttpChannelizer}
            - {name: gremlinserver.evaluationTimeout, value: "4000"}
            - {name: "gremlinserver.serializers[+].className", value: org.apache.tinkerpop.gremlin.util.ser.GraphSONUntypedMessageSerializerV1}
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -ec
                  - |
                    curl -fsS --retry 60 --retry-delay 2 --retry-connrefused --retry-max-time 150 --max-time 6 'http://127.0.0.1:8182/?gremlin=1' >/dev/null
                    curl -fsS --max-time 15 -H 'Content-Type: application/json' --data-binary @/graph-init/schema.json http://127.0.0.1:8182/
                    {{- if .Values.janusgraph.seedDemo }}
                    curl -fsS --max-time 15 -H 'Content-Type: application/json' --data-binary @/graph-init/seed.json http://127.0.0.1:8182/
                    {{- end }}
          volumeMounts:
            - {name: graph-init, mountPath: /graph-init, readOnly: true}
          startupProbe:
            tcpSocket: {port: gremlin}
            periodSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: "/?gremlin=1", port: gremlin}
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.janusgraph.resources | nindent 12 }}
      volumes:
        - name: graph-init
          configMap: {name: {{ .Release.Name }}-graph-init}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-janusgraph
spec:
  selector:
    app.kubernetes.io/name: janusgraph
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - {name: gremlin, port: 8182, targetPort: gremlin}
