api:
  image: wb-graph-api:0.7.0
  imagePullPolicy: IfNotPresent
  resources:
    requests: {cpu: 100m, memory: 64Mi}
    limits: {memory: 256Mi}

janusgraph:
  image: janusgraph/janusgraph:1.1.0
  imagePullPolicy: IfNotPresent
  seedDemo: true
  resources:
    requests: {cpu: 250m, memory: 768Mi}
    limits: {memory: 1536Mi}

cassandra:
  image: cassandra:4.0.20
  imagePullPolicy: IfNotPresent
  storage:
    className: ""
    size: 2Gi
  resources:
    requests: {cpu: 250m, memory: 768Mi}
    limits: {memory: 1536Mi}

kafka:
  image: apache/kafka:3.9.1
  topic: transfers.v1
  groupID: graph-ingestion
  archiveGroupID: graph-archive
  storageSize: 2Gi
  resources:
    requests: {cpu: 250m, memory: 768Mi}
    limits: {memory: 1536Mi}

elasticsearch:
  image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
  storageSize: 2Gi
  resources:
    requests: {cpu: 250m, memory: 1024Mi}
    limits: {memory: 2048Mi}

hdfs:
  image: apache/hadoop:3.4.2
  archiveRoot: /archive/kafka
  metadataSize: 1Gi
  dataSize: 2Gi
  resources:
    requests: {cpu: 150m, memory: 512Mi}
    limits: {memory: 1024Mi}

spark:
  image: apache/spark:3.5.8-scala2.12-java17-python3-ubuntu
  featureRoot: /features
  run:
    enabled: false
    id: ""
    date: ""
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: "2", memory: 1536Mi}

airflow:
  enabled: true
  image: apache/airflow:3.4.0-python3.12
  schedule: "0 1 * * *"
  storageSize: 1Gi
  resources:
    requests: {cpu: 350m, memory: 768Mi}
    limits: {memory: 2048Mi}
