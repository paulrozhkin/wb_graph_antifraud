api:
  image: wb-graph-api:0.3.0
  imagePullPolicy: IfNotPresent
  resources:
    requests: {cpu: 100m, memory: 64Mi}
    limits: {memory: 256Mi}

janusgraph:
  image: janusgraph/janusgraph:1.1.0
  imagePullPolicy: IfNotPresent
  seedDemo: true
  resources:
    requests: {cpu: 250m, memory: 768Mi}
    limits: {memory: 1536Mi}

cassandra:
  image: cassandra:4.0.20
  imagePullPolicy: IfNotPresent
  storage:
    className: ""
    size: 2Gi
  resources:
    requests: {cpu: 250m, memory: 768Mi}
    limits: {memory: 1536Mi}

kafka:
  image: apache/kafka:3.9.1
  topic: transfers.v1
  groupID: graph-ingestion
  storageSize: 2Gi
  resources:
    requests: {cpu: 250m, memory: 768Mi}
    limits: {memory: 1536Mi}
